name: Quality gates

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: naturequery
          POSTGRES_PASSWORD: naturequery
          POSTGRES_DB: naturequery_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U naturequery -d naturequery_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://naturequery:naturequery@localhost:5432/naturequery_ci
      NEXTAUTH_URL: http://localhost:3000
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXTAUTH_SECRET: ci-only-secret-value-with-at-least-32-characters
      ENCRYPTION_KEY: 0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
      CRON_SECRET: ci-only-cron-secret-value-with-at-least-32-characters
      RESEND_API_KEY: re_ci_only_placeholder
      EMAIL_FROM: NatureQuery CI <ci@example.com>
      CI: true

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npm exec prisma generate

      - name: Apply migrations to disposable database
        run: npm exec prisma migrate deploy

      - name: Verify migrated schema matches Prisma schema
        run: npm exec prisma migrate diff -- --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code

      - name: Validate source
        run: npm run validate

      - name: Build production application
        run: npm run build
